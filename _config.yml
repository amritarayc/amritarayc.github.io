title: Amrita Raychaudhury
description: A little world of work, stories, and things that caught my curiosity.
url: https://amritarayc.github.io
baseurl: ""
markdown: kramdown
collections:
  travels:
    output: true
    permalink: /travel/:name/
  artwork:
    output: true
    permalink: /art/:name/
  books:
    output: true
    permalink: /books/:name/
  recipes:
    output: true
    permalink: /recipes/:name/
  hobbies:
    output: true
    permalink: /hobbies/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: travels
    values:
      layout: entry
  - scope:
      path: ""
      type: artwork
    values:
      layout: entry
  - scope:
      path: ""
      type: books
    values:
      layout: entry
  - scope:
      path: ""
      type: recipes
    values:
      layout: entry
  - scope:
      path: ""
      type: hobbies
    values:
      layout: entry
exclude: [README.md, CONTENT_GUIDE.md]
