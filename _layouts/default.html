<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ec">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Amrita Raychaudhury</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/leaf.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Amrita — home">amrita{% include sprig.html %}</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/work/' | relative_url }}" {% if page.section == 'work' %}aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/#outside-work' | relative_url }}" {% if page.collection %}aria-current="true"{% endif %}>Outside work</a>
    </nav>
    <a class="hello-link" href="mailto:amrita.raychaudhury@rwth-aachen.de">Say hello {% include arrow.html %}</a>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><p>A little space for the things that make me, me.</p><a href="{{ '/' | relative_url }}">Back to the desk {% include arrow.html %}</a><span>Reutlingen, Germany</span></footer>
</body>
</html>
